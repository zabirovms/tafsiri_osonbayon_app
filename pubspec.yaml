name: quran_osonbayon
description: A comprehensive Flutter app for reading the Quran in Tajik with advanced features
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1


  url_launcher: ^6.3.0
  app_links: ^6.4.1


  # Network
  dio: ^5.9.0
  http: ^1.5.0
  connectivity_plus: ^7.3.1

  # UI
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  awesome_snackbar_content: ^0.1.3


  # Audio
  just_audio: ^0.10.5
  audio_session: ^0.1.25
  audio_video_progress_bar: ^1.0.1
  audio_service: ^0.18.18
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  permission_handler: ^11.4.0
  flutter_compass: ^0.8.1
  geolocator: ^13.0.4
  vibration: ^3.1.3

  # Utils
  in_app_update: ^4.2.5
  in_app_review: ^2.0.9
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  html: ^0.15.6
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  sqflite: ^2.4.2
  path: ^1.9.0
  flutter_local_notifications: ^17.2.4
  
  # Firebase
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  firebase_analytics: ^11.6.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_remote_config: ^5.5.0

  # Utils
  device_info_plus: ^9.1.2
  package_info_plus: ^8.3.1
  image_picker: ^1.0.8

  # Navigation
  go_router: ^16.3.0
  scrollable_positioned_list: ^0.3.7
  # Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  flutter_islamic_icons: ^1.0.2
  font_awesome_flutter: ^11.0.0
  hive_flutter: ^1.1.0
  
  qcf_quran:
    path: packages/qcf_quran_with_update
  # Bottom Navigation
  circle_nav_bar: ^2.2.0
  drift: ^2.34.4
  sqlite3_flutter_libs: ^0.6.0
  animated_theme_switcher: ^2.0.8
  quick_actions: ^1.1.0
  home_widget: ^0.7.0+1
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Integration Testing
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.11.1
  json_serializable: ^6.11.4

  # Linting
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

  # Testing
  mockito: ^5.6.4
  bloc_test: ^10.0.0
  drift_dev: ^2.34.0
flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/covers/
    - assets/images/reciters_photo/
    - assets/audio/
    - assets/icons/
    - assets/svgs/
    - assets/svgs/surah_names/
    - assets/data/
    - assets/data/quran/
    - assets/data/reciters/
    - assets/data/reciters/wbw-timestamps/


  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: Noto_Naskh_Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
    - family: QPC_Hafs
      fonts:
        - asset: assets/fonts/QPC_Hafs.ttf
    - family: AlQuranNeov5x1
      fonts:
        - asset: assets/fonts/AlQuranNeov5x1.ttf
    - family: IndopakNastaleeq
      fonts:
        - asset: assets/fonts/Indopak_Nastaleeq.ttf
    - family: surah-name-v1
      fonts:
        - asset: assets/fonts/surah-name-v1.ttf


flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: assets/icons/app_icon_padded.png
  image_path_ios: assets/icons/app_icon_ios.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icons/app_icon_padded.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  image: assets/images/splash_screen.png
  android: true
  ios: true
  # Android 12+ will use windowBackground with full image instead of icon-based splash
  fullscreen: true
  android_gravity: fill
  ios_content_mode: scaleAspectFill
  web: false
